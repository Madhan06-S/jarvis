<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Voice Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Courier New', monospace; }
        .log-line { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-2xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-cyan-400">🔧 J.A.R.V.I.S. Voice Diagnostic</h1>
        
        <!-- Step 1: Backend Check -->
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
            <h2 class="text-sm font-bold text-slate-300 mb-2">Step 1: Backend Status</h2>
            <div id="backend-status" class="text-xs space-y-1"></div>
            <button onclick="checkBackend()" class="mt-2 px-3 py-1 bg-cyan-700 rounded text-xs hover:bg-cyan-600">Check Backend</button>
        </div>
        
        <!-- Step 2: WebSocket Test -->
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
            <h2 class="text-sm font-bold text-slate-300 mb-2">Step 2: WebSocket Connection</h2>
            <div id="ws-status" class="text-xs space-y-1"></div>
            <button onclick="testWebSocket()" class="mt-2 px-3 py-1 bg-cyan-700 rounded text-xs hover:bg-cyan-600">Test WebSocket</button>
        </div>
        
        <!-- Step 3: Microphone Test -->
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
            <h2 class="text-sm font-bold text-slate-300 mb-2">Step 3: Microphone</h2>
            <div id="mic-status" class="text-xs space-y-1"></div>
            <button onclick="testMic()" class="mt-2 px-3 py-1 bg-cyan-700 rounded text-xs hover:bg-cyan-600">Test Mic</button>
        </div>
        
        <!-- Step 4: Send Test Command -->
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
            <h2 class="text-sm font-bold text-slate-300 mb-2">Step 4: Send Command</h2>
            <div class="flex gap-2">
                <input id="test-input" type="text" value="Hello JARVIS" 
                       class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1 text-xs text-cyan-100">
                <button onclick="sendTest()" class="px-3 py-1 bg-emerald-700 rounded text-xs hover:bg-emerald-600">Send</button>
            </div>
            <div id="test-result" class="mt-2 text-xs"></div>
        </div>
        
        <!-- Live Log -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800 h-64 overflow-y-auto font-mono text-[10px]">
            <h2 class="text-xs font-bold text-slate-500 mb-2 sticky top-0 bg-slate-900">Live Log</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const log = (msg, type = 'info') => {
            const div = document.getElementById('log');
            const line = document.createElement('div');
            line.className = `log-line ${type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : 'text-slate-400'}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(line);
            div.scrollTop = div.scrollHeight;
        };
        
        const BACKEND = window.location.origin; // Assumes same origin, adjust if needed
        
        async function checkBackend() {
            const el = document.getElementById('backend-status');
            el.innerHTML = '<span class="text-amber-400">Checking...</span>';
            
            try {
                const res = await fetch(`${BACKEND}/debug/voice-status`);
                const data = await res.json();
                el.innerHTML = `<pre class="text-[10px] text-emerald-400 overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>`;
                log('Backend check passed', 'success');
            } catch (e) {
                el.innerHTML = `<span class="text-red-400">Failed: ${e.message}</span>`;
                log(`Backend check failed: ${e.message}`, 'error');
            }
        }
        
        function testWebSocket() {
            const el = document.getElementById('ws-status');
            el.innerHTML = '<span class="text-amber-400">Connecting...</span>';
            
            const wsUrl = BACKEND.replace(/^http/, 'ws') + '/ws/voice';
            log(`Testing WebSocket: ${wsUrl}`);
            
            const ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                el.innerHTML = '<span class="text-emerald-400">✅ WebSocket CONNECTED</span>';
                log('WebSocket connected!', 'success');
                ws.send(JSON.stringify({type: 'ping'}));
            };
            
            ws.onmessage = (e) => {
                log(`WS received: ${e.data.substring(0, 100)}`);
                const data = JSON.parse(e.data);
                if (data.type === 'connected') {
                    el.innerHTML += '<br><span class="text-emerald-400">✅ Server responded with: ' + data.message + '</span>';
                }
            };
            
            ws.onerror = (e) => {
                el.innerHTML = '<span class="text-red-400">❌ WebSocket ERROR</span>';
                log('WebSocket error', 'error');
            };
            
            ws.onclose = (e) => {
                if (e.code !== 1000) {
                    el.innerHTML += `<br><span class="text-red-400">❌ Closed with code ${e.code}</span>`;
                    log(`WebSocket closed: ${e.code}`, 'error');
                }
            };
        }
        
        async function testMic() {
            const el = document.getElementById('mic-status');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({audio: true});
                el.innerHTML = '<span class="text-emerald-400">✅ Microphone access GRANTED</span>';
                log('Microphone access granted', 'success');
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {
                el.innerHTML = `<span class="text-red-400">❌ ${e.message}</span>`;
                log(`Microphone error: ${e.message}`, 'error');
            }
        }
        
        async function sendTest() {
            const text = document.getElementById('test-input').value;
            const el = document.getElementById('test-result');
            el.innerHTML = '<span class="text-amber-400">Sending...</span>';
            
            try {
                // Try WebSocket first
                const wsUrl = BACKEND.replace(/^http/, 'ws') + '/ws/voice';
                const ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    ws.send(JSON.stringify({type: 'text_command', text}));
                };
                
                ws.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    el.innerHTML += `<div class="log-line text-slate-400">${data.type}: ${JSON.stringify(data).substring(0, 200)}</div>`;
                    if (data.type === 'response') {
                        log(`Got response: ${data.text.substring(0, 100)}`, 'success');
                        ws.close();
                    }
                };
                
                // Timeout fallback to REST
                setTimeout(async () => {
                    if (ws.readyState !== WebSocket.OPEN) {
                        log('WS failed, trying REST...');
                        const res = await fetch(`${BACKEND}/voice/text-command`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({text})
                        });
                        const data = await res.json();
                        el.innerHTML = `<pre class="text-[10px] text-emerald-400">${JSON.stringify(data, null, 2)}</pre>`;
                        log('REST response received', 'success');
                    }
                }, 2000);
                
            } catch (e) {
                el.innerHTML = `<span class="text-red-400">${e.message}</span>`;
                log(`Send failed: ${e.message}`, 'error');
            }
        }
        
        log('Diagnostic page loaded');
        log(`Backend URL detected as: ${BACKEND}`);
    </script>
</body>
</html>
